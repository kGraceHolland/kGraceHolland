<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registry Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--side:#e5edf0;--tx:#0f172a;--mut:#64748b;--bd:#e5e7eb;--hd:#f8fafc;--pri:#8fdca8;--pritx:#0b3d1f;--red:#dc2626;--grn:#16a34a;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--tx);background:#fff;font-size:14px;line-height:1.4}
a{color:inherit}
.app{display:flex;min-height:100vh}
aside{width:190px;background:var(--side);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;transition:width .15s}
aside.col{width:62px}aside.col .lbl{display:none}
.logo{padding:16px 16px 14px;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo .wm{font-size:20px;font-weight:600;color:#0f3b57;letter-spacing:-.02em;line-height:1}
.logo .wm small{display:block;font-size:6.5px;letter-spacing:.22em;color:#2f8fb0;font-weight:600;margin-top:3px}
.nav{margin-top:18px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 18px;color:#52606d;text-decoration:none;font-weight:500;font-size:13.5px}
.nav a.on{color:#0f172a;font-weight:600}
.nav a:hover{color:#0f172a}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a9aa8;padding:18px 18px 4px}
.sidefoot{margin-top:auto;padding:12px}
.langrow{display:flex;justify-content:space-between;align-items:center;background:#f4f8f9;border-radius:8px;padding:6px 10px;margin-bottom:10px}
.langrow select{border:0;background:none;font:500 12px Inter,system-ui,sans-serif}
.me{display:flex;gap:8px;align-items:center}
.av{width:28px;height:28px;border-radius:6px;background:#bfe8c9;color:#14532d;font-weight:600;font-size:11px;display:grid;place-items:center;flex-shrink:0}
.me b{font-size:12.5px;display:block}.me span{font-size:11px;color:var(--mut);display:block;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mainwrap{flex:1;min-width:0}
.banner{background:#fff7ed;color:#9a3412;font-size:12px;padding:6px 24px;border-bottom:1px solid #fed7aa;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.banner button{border:0;background:none;color:#9a3412;font:600 12px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:underline;padding:0 0 0 10px}
main{padding:20px 24px 60px;max-width:1240px}
.crumb{font-weight:600;font-size:15px;margin:6px 0 30px;display:flex;align-items:center;gap:8px;color:var(--tx)}
.crumb a{text-decoration:none;color:var(--mut);font-weight:500}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
.sub{color:var(--mut);margin:0 0 16px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;border-radius:6px;padding:7px 12px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;color:var(--tx);text-decoration:none;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pritx)}
.btn.pri:hover{background:#7bd197}
.btn.pri:disabled{opacity:.5;cursor:not-allowed}
.btn.dan{color:var(--red);border-color:#fecaca}
.btn.ghost{border-color:transparent;background:none}
.tw{border:1px solid var(--bd);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--hd);text-align:left;font-weight:600;font-size:12.5px;padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;font-size:13px}
td+td,th+th{border-left:1px solid var(--bd)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fbfcfd}
td.num,th.num{text-align:right}
td.act{white-space:nowrap;text-align:right;width:1%}
.small{font-size:11.5px;color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.trunc{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.b-dev{background:#fdebd3;color:#b45309}.b-buy{background:#dcfce7;color:#15803d}
.b-red{background:#e0f2fe;color:#0369a1}.b-rmv{background:#f3e8ff;color:#7e22ce}.b-ret{background:#dcfce7;color:#15803d}
.b-done,.b-active{background:#dcfce7;color:#15803d}.b-pending{background:#fef9c3;color:#a16207}.b-cancelled{background:#fee2e2;color:#b91c1c}.b-draft{background:#e2e8f0;color:#475569}
.b-ver{background:#dcfce7;color:#166534}.b-inf{background:#e0e7ff;color:#3730a3}
.b-hi{background:#fee2e2;color:#b91c1c}.b-med{background:#fef3c7;color:#92400e}.b-lo{background:#f1f5f9;color:#475569}
.atype{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--bd);border-radius:5px;padding:2px 7px;font-size:11.5px;margin:1px 0;white-space:nowrap}
.atype svg{width:12px;height:12px}
.stack{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.wrapb{display:flex;flex-wrap:wrap;gap:4px;max-width:120px}
.icb{border:0;background:none;padding:5px;border-radius:5px;cursor:pointer;color:#475569;display:inline-grid;place-items:center;vertical-align:middle}
.icb:hover{background:#eef2f5;color:#0f172a}
.icb.dan:hover{color:var(--red)}
.icb svg{width:15px;height:15px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mut);font-size:13px;flex-wrap:wrap;gap:10px}
.pager .pg{display:flex;gap:6px;align-items:center}
.pager select{width:auto;border:1px solid var(--bd);border-radius:6px;padding:4px 6px;font:13px Inter,system-ui,sans-serif}
.pager .icb{border:1px solid var(--bd)}
.pager .icb:disabled{opacity:.35;cursor:default}
.tabs{display:inline-flex;background:#f1f5f9;border-radius:8px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 11px;border-radius:6px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;color:#334155}
.tabs button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);color:#0f172a}
.card{border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px;background:#fff}
.card h2{font-size:17px;margin:0 0 2px;letter-spacing:-.01em}
.card .sub{font-size:12.5px;margin-bottom:14px}
.kv{display:grid;gap:14px}
.kv label{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px;margin-bottom:3px}
.hero{background:linear-gradient(115deg,#1d4a73 0%,#2c7fa6 50%,#62d0ea 100%);color:#fff;margin:-20px -24px 20px;padding:22px 24px 26px}
.hero .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero .acts{display:flex;gap:6px;flex-wrap:wrap}
.hero .acts .btn{padding:6px 10px;font-size:12.5px}
.pill{display:inline-flex;gap:6px;align-items:center;background:#5cc27f;color:#fff;border-radius:6px;padding:5px 10px;font-weight:600;font-size:12px}
.pill.draft{background:#94a3b8}
.hero .dev{font-size:12px;font-weight:600;letter-spacing:.08em;color:#b6f0c8;margin:22px 0 6px;text-transform:uppercase}
.hero h1{font-size:34px;color:#fff;margin:0 0 12px;font-weight:600}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.95}
.hero .tabs{background:rgba(255,255,255,.18);margin:30px 0 0}
.hero .tabs button{color:#fff}.hero .tabs button.on{color:#0f172a;background:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--bd);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat .ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;margin-bottom:10px}
.stat .ic svg{width:15px;height:15px}
.stat .l{font-size:12px;color:#334155}.stat .v{font-size:20px;font-weight:700}.stat .u{font-size:11.5px;color:var(--mut);margin-left:3px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.side-panel{background:#e6f3fb;border-radius:10px;padding:16px}
.side-panel h4{font-size:10.5px;letter-spacing:.08em;color:#2f7fa6;margin:14px 0 6px}
.side-panel h4:first-child{margin-top:0}
.sdg{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:4px;color:#fff;font-weight:700;font-size:13px;margin:0 4px 4px 0}
.practice{display:flex;gap:10px;align-items:center;background:#f8fafc;border-radius:8px;padding:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgph{height:220px;border-radius:10px;background:linear-gradient(135deg,#dbeafe,#e0f2fe 40%,#dcfce7);display:grid;place-items:center;color:#2c7fa6;font-weight:600;letter-spacing:.2em;margin-bottom:16px}
.map{height:240px;border-radius:8px;background:#d9e7ec;position:relative;overflow:hidden}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--mut);margin:-2px 0 5px}
input[type=text],input[type=number],input[type=email],input[type=date],select,textarea{width:100%;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font:13px Inter,system-ui,sans-serif;color:var(--tx);background:#fff}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bbf7d0;border-color:#86efac}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{border:1.5px solid var(--bd);border-radius:8px;padding:14px;text-align:center;cursor:pointer;background:#fff}
.opt.on{border-color:#86d99f;background:#f0fdf4}
.opt b{display:block;margin-top:6px}.opt span{font-size:11.5px;color:var(--mut)}
.alloc{border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}
.alloc .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drop{border:1.5px dashed #cbd5e1;border-radius:8px;padding:22px;text-align:center;color:var(--mut)}
.err{color:var(--red);font-size:12px;margin-top:4px}
.empty{text-align:center;padding:40px;color:var(--mut)}
.search{max-width:280px;margin-bottom:12px}
#modal .ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
#modal .dlg{background:#fff;border-radius:10px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal .dlg.wide{width:min(820px,100%)}
#modal h3{margin:0 0 4px;font-size:16px}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60}
#toast div{background:#0f172a;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;margin-top:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.find{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.find .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.find .t b{font-size:14px}
.find p{margin:4px 0;font-size:13px;color:#334155}
.find .imp{color:#0f5132}
.chk td:first-child{font-weight:500}
.ok{color:var(--grn);font-weight:600}.bad{color:var(--red);font-weight:600}
.pos{color:var(--grn);font-weight:600}.negr{color:var(--red);font-weight:600}
.mgrid th,.mgrid td{text-align:center}
.mgrid td.cell{cursor:pointer;color:var(--mut)}
.mgrid td.cell:hover{background:#f0fdf4}
.mgrid tr.farm td{background:#f8fafc;font-weight:600;text-align:left}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){aside{width:62px}aside .lbl{display:none}main{padding:16px 16px 60px}.hero{margin:-16px -16px 16px;padding:18px 16px}.row2,.row3,.pgrid{grid-template-columns:1fr}.hero h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<div class="mainwrap">
<div class="banner"><span>Replica with synthetic test data. Not connected to the live registry. Changes live in this tab only.</span><span><button data-a="export">Export JSON</button><button data-a="import">Import JSON</button><button data-a="reset">Reset test data</button></span></div>
<main id="main"></main>
</div>
</div>
<div id="modal"></div><div id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script>
/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(1);
const ri=(a,b)=>Math.floor(R()*(b-a+1))+a;
const pick=a=>a[Math.floor(R()*a.length)];
const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const nid=(p,rand=R)=>p+'_'+Array.from({length:21},()=>AL[Math.floor(rand()*62)]).join('');
const uid=p=>nid(p,Math.random);
const iso=s=>new Date(s).toISOString();
const addD=(s,d,h=0)=>new Date(new Date(s).getTime()+d*864e5+h*36e5).toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fD=s=>{const d=new Date(s);return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`};
const fDT=(s,sec=true)=>{const d=new Date(s);return `${fD(s)}${sec?',':''} ${p2(d.getHours())}:${p2(d.getMinutes())}${sec?':'+p2(d.getSeconds()):''}`};
const fLong=s=>new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fN=n=>Number(n||0).toLocaleString('en-US');
const sum=a=>a.reduce((x,y)=>x+y,0);
const byId=(arr,id)=>arr.find(x=>x.id===id);

/* ================= icons ================= */
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
 biz:sv('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>'),
 farm:sv('<path d="M7 20h10M12 20v-8M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 12C12 9 10 7 5 7c0 3 2 5 7 5"/>'),
 proj:sv('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 16v-3M12 16v-5M16 16v-2"/>'),
 ops:sv('<path d="M7 7h13l-3-3M17 17H4l3 3"/>'),
 users:sv('<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/>'),
 flag:sv('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
 eye:sv('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
 copy:sv('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>'),
 trash:sv('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
 edit:sv('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 plus:sv('<path d="M12 5v14M5 12h14"/>'),
 coin:sv('<circle cx="9" cy="9" r="6"/><path d="M15.1 9.4a6 6 0 1 1-5.7 5.7"/>'),
 share:sv('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>'),
 back:sv('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
 up:sv('<path d="M12 19V5M6 11l6-6 6 6"/>'),
 down:sv('<path d="M3 7l6 6 4-4 8 8M21 11v6h-6"/>'),
 leaf:sv('<path d="M11 20A7 7 0 0 1 4 13c0-6 7-9 16-9 0 9-3 16-9 16zM4 20c4-4 7-6 11-8"/>'),
 pin:sv('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
 cal:sv('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>'),
 trend:sv('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),
 target:sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
 area:sv('<path d="M7 20h10M12 20v-9M12 11c-3 0-5-2-5-5 3 0 5 2 5 5zM12 11c3 0 5-2 5-5-3 0-5 2-5 5z"/>'),
 chevL:sv('<path d="M15 18l-6-6 6-6"/>'),chevR:sv('<path d="M9 18l6-6-6-6"/>'),
 chevLL:sv('<path d="M11 18l-6-6 6-6M19 18l-6-6 6-6"/>'),chevRR:sv('<path d="M13 18l6-6-6-6M5 18l6-6-6-6"/>'),
 upload:sv('<path d="M12 15V3M7 8l5-5 5 5M4 17v3h16v-3"/>'),
 dots:sv('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
 swap:sv('<path d="M7 7h13l-3-3M17 17H4l3 3"/>'),
 fire:sv('<path d="M12 21c-4 0-6-3-6-6 0-4 4-6 4-10 3 2 4 4 4 6 1-1 2-2 2-4 2 2 4 5 4 8 0 3-3 6-8 6z"/>'),
 doc:sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>'),
 hash:sv('<path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/>'),
 tag:sv('<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/>'),
 panel:sv('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>'),
};
const LOGO=`<svg width="26" height="26" viewBox="0 0 32 32"><path d="M2 5h28l-9 6H11z" fill="#2f8fb0"/><path d="M11 11h10l-4 17h-3z" fill="#1d4a73"/><path d="M21 11l5-3-6 12z" fill="#62d0ea"/></svg>`;

/* ================= reference data ================= */
const TYPES={red:{l:'Reduction',s:'RED',c:'b-red',ic:I.down},rmv:{l:'Removal',s:'RMV',c:'b-rmv',ic:I.up},ret:{l:'Retention',s:'RET',c:'b-ret',ic:I.leaf}};
const TORDER=['red','rmv','ret'];
const SRC={bio:'Biogenic',tec:'Technological'};
const PRACTICES=['Optimized fertilizer timing','Nitrification inhibitors','Mulching & crop residue cover','Intercropping','Renewable electricity use','Cover cropping','Reduced tillage','Organic amendments','Hedgerow planting','Precision irrigation'];
const COBEN=['Biodiversity improvement','Soil health','Water retention','Rural employment'];
const SDGS=[[1,'No Poverty','#e5243b'],[2,'Zero Hunger','#dda63a'],[3,'Good Health','#4c9f38'],[4,'Education','#c5192d'],[5,'Gender Equality','#ff3a21'],[6,'Clean Water','#26bde2'],[7,'Clean Energy','#fcc30b'],[8,'Economic Growth','#a21942'],[9,'Innovation','#fd6925'],[10,'Reduced Inequality','#dd1367'],[11,'Sustainable Cities','#fd9d24'],[12,'Responsible Consumption','#bf8b2e'],[13,'Climate Action','#3f7e44'],[14,'Life Below Water','#0a97d9'],[15,'Life on Land','#56c02b'],[16,'Peace & Justice','#00689d'],[17,'Partnerships','#19486a']];
const NOW='2026-09-24T10:00:00';

/* ================= seed ================= */
function seed(){
 R=mulberry32(20260924);
 const D={businesses:[],farms:[],projects:[],assets:[],operations:[],users:[],currentUserId:null};

function ledger(){
 const hold={},reserved={},issued={},retired={};
 const add=(m,a,b,n)=>{(m[a]??={});m[a][b]=(m[a][b]||0)+n};
 [...DB.operations].sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).forEach(op=>{
  if(op.status==='Cancelled') return;
  op.lines.forEach(l=>{
   if(op.status==='Pending'){ if(op.type!=='Issue') add(reserved,l.assetId,op.fromBusinessId,l.amount); return; }
   if(op.type==='Issue'){add(hold,l.assetId,op.fromBusinessId,l.amount);issued[l.assetId]=(issued[l.assetId]||0)+l.amount}
   else if(op.type==='Transfer'){add(hold,l.assetId,op.fromBusinessId,-l.amount);add(hold,l.assetId,op.targetBusinessId,l.amount)}
   else if(op.type==='Retire'){add(hold,l.assetId,op.fromBusinessId,-l.amount);retired[l.assetId]=(retired[l.assetId]||0)+l.amount}
  });
 });
 return {hold,reserved,issued,retired,
  held:(a,b)=>hold[a]?.[b]||0,
  free:(a,b)=>(hold[a]?.[b]||0)-(reserved[a]?.[b]||0)};
}

 if(!CO||CO.pid!==p.id) CO={pid:p.id,type:'Transfer',name:'',target:'',notes:'',method:'type',from:p.businessId,files:[],amt:{},price:{},cur:{},err:{}};
 const L=ledger();
 const as=projAssets(p.id);
 const holders=[...new Set(as.flatMap(a=>Object.keys(L.hold[a.id]||{}).filter(b=>L.held(a.id,b)>0)))];
 const avT=t=>sum(as.filter(a=>a.type===t).map(a=>Math.max(0,L.free(a.id,CO.from))));
 const types=TORDER.filter(t=>as.some(a=>a.type===t));
 const years=[...new Set(as.map(a=>a.vintage))].sort((a,b)=>b-a);
 const total=sum(Object.values(CO.amt).map(Number).filter(n=>n>0));

 const allocBlock=CO.method==='type'?types.map(t=>`<div class="alloc"><div class="h">${achip(t)}<span class="small">Available: ${fN(avT(t))} tokens</span></div><div class="row3">
   <div><label class="small">Tokens</label><div style="display:flex;gap:4px"><input type="number" min="0" data-co="amt:${t}" value="${CO.amt[t]||''}"><button class="btn" data-a="coMax" data-k="${t}" data-max="${avT(t)}">Max</button></div></div>
   <div><label class="small">Price per token</label><input type="number" min="0" step="0.01" data-co="price:${t}" value="${CO.price[t]||''}"></div>
   <div><label class="small">Currency</label><select data-co="cur:${t}">${['EUR','USD','GBP'].map(c=>`<option ${ (CO.cur[t]||'EUR')===c?'selected':''}>${c}</option>`).join('')}</select></div></div>${CO.err[t]?`<div class="err">${CO.err[t]}</div>`:''}</div>`).join('')
  :`<div class="tw"><table><thead><tr><th>Vintage</th>${types.map(t=>`<th>${TYPES[t].l}</th>`).join('')}</tr></thead><tbody>${years.map(y=>`<tr><td><b>${y}</b></td>${types.map(t=>{const av=sum(as.filter(a=>a.type===t&&a.vintage===y).map(a=>Math.max(0,L.free(a.id,CO.from))));const k=t+'|'+y;return `<td>${as.some(a=>a.type===t&&a.vintage===y)?`<input type="number" min="0" max="${av}" data-co="amt:${k}" value="${CO.amt[k]||''}" style="max-width:110px"><div class="small">of ${fN(av)}</div>`:'<span class="small">—</span>'}${CO.err[k]?`<div class="err">${CO.err[k]}</div>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
 return `<div class="crumb"><a href="#/operations">Operations</a> › Create Operation<span style="margin-left:auto"><a class="btn" href="#/projects/${p.id}">${I.back.replace('<svg','<svg width="14"')} Back to Project</a></span></div>
 <h1>Create Operation</h1><p class="sub">Create a new operation to transfer or retire tokens for this project.</p>
 <p><span class="alloc" style="padding:4px 8px">Project: <b>${esc(p.name)}</b></span> <span class="badge b-red" style="padding:5px 8px">Business: ${esc(bizName(CO.from))}</span></p>
 <div style="max-width:880px">
 <div class="card"><h2>Operation Details</h2><p class="sub">Configure operation type and provide a name for tracking.</p>
  <div class="field"><label>Source business <span class="badge b-inf">replica extension</span></label><div class="hint">Live registry fixes the source to the project developer. Here you can pick any current holder, e.g. to retire on a buyer's behalf.</div><select data-co="from">${holders.concat(holders.includes(p.businessId)?[]:[p.businessId]).map(b=>`<option value="${b}" ${b===CO.from?'selected':''}>${esc(bizName(b))}</option>`).join('')}</select></div>
  <label class="small" style="font-weight:600;letter-spacing:.05em">OPERATION TYPE</label>
  <div class="row2" style="margin:6px 0 14px"><div class="opt ${CO.type==='Transfer'?'on':''}" data-a="coType" data-k="Transfer">${I.swap.replace('<svg','<svg width="20"')}<b>Transfer</b><span>Transfer assets to another business</span></div><div class="opt ${CO.type==='Retire'?'on':''}" data-a="coType" data-k="Retire">${I.fire.replace('<svg','<svg width="20"')}<b>Retire</b><span>Permanently retire assets (burn)</span></div></div>
  <div class="field"><label>Operation Name *</label><input type="text" data-co="name" placeholder="e.g., Q1 2025 Token Transfer to Acme Corp" value="${esc(CO.name)}">${CO.err.name?`<div class="err">${CO.err.name}</div>`:''}</div>
  ${CO.type==='Transfer'?`<div class="field"><label>Target Business *</label><select data-co="target"><option value="">Select target business</option>${targets.map(b=>`<option value="${b.id}" ${b.id===CO.target?'selected':''}>${esc(b.name)}</option>`).join('')}</select>${CO.err.target?`<div class="err">${CO.err.target}</div>`:''}</div>`:''}

 <div class="card"><h2>Asset Selection</h2><p class="sub">Choose how you want to allocate assets for this operation.</p>
  <label class="small" style="font-weight:600;letter-spacing:.05em">ALLOCATION METHOD</label>

  <h4 style="margin:4px 0">Asset allocation</h4><p class="sub">${CO.method==='type'?'Enter the total amount and price for each asset type. Tokens will be allocated from the newest vintage years first.':'Enter amounts per type and vintage year.'}</p>${types.length?allocBlock:'<div class="empty">This project has no issued assets.</div>'}</div>
 <div style="display:flex;justify-content:flex-end;gap:8px"><a class="btn" href="#/projects/${p.id}">Cancel</a><button class="btn pri" data-a="coSubmit" ${total>0?'':'disabled'}>Create Operation (${fN(total)} tokens)</button></div></div>`;
}
function coSubmit(){
 const p=byId(DB.projects,CO.pid); const L=ledger(); const as=projAssets(p.id); CO.err={};
 if(!CO.name.trim()) CO.err.name='Operation name is required.';
 if(CO.type==='Transfer'&&!CO.target) CO.err.target='Select a target business.';
 const lines=[];
 const take=(pool,n,key,t)=>{let left=n;for(const a of pool){const f=Math.max(0,L.free(a.id,CO.from));if(!f)continue;const x=Math.min(f,left);if(x>0){lines.push({assetId:a.id,amount:x,...(CO.type==='Transfer'?{price:Number(CO.price[t]||0),currency:CO.cur[t]||'EUR'}:{})});left-=x}if(!left)break}if(left>0)CO.err[key]=`Only ${fN(n-left)} available.`};
 Object.entries(CO.amt).forEach(([k,v])=>{const n=Math.floor(Number(v));if(!(n>0))return;const [t,y]=k.split('|');const pool=as.filter(a=>a.type===t&&(!y||a.vintage==y)).sort((a,b)=>b.vintage-a.vintage);take(pool,n,k,t)});
 if(!lines.length&&!Object.keys(CO.err).length) CO.err.name='Allocate at least one token.';
 if(Object.keys(CO.err).length){render();toast('Fix the highlighted fields');return}
 const now=new Date().toISOString();
 DB.operations.unshift({id:uid('op'),name:CO.name.trim(),type:CO.type,projectId:p.id,fromBusinessId:CO.from,targetBusinessId:CO.type==='Transfer'?CO.target:null,lines,status:'Pending',createdAt:now,completedAt:null,attachments:[...CO.files],notes:CO.notes});
 CO=null; toast('Operation created as Pending'); go('#/operations?status=pending');
}

let MT=null;
function vMint(pid){
 const p=byId(DB.projects,pid); if(!p) return '<div class="empty">Project not found</div>';
 const maxIssued=Math.max(0,...projAssets(pid).map(a=>a.vintage));
 const minY=maxIssued?maxIssued+1:2020, maxY=2026;
 if(!MT||MT.pid!==pid) MT={pid,files:[],issuer:'',certId:'',certAt:'',years:[Math.min(maxY,Math.max(minY,2025))],vals:{},mode:'form',err:''};
 const tot=sum(Object.values(MT.vals).flatMap(v=>Object.values(v).map(Number).filter(n=>n>0)));
 const hasPdf=MT.files.some(f=>/\.pdf$/i.test(f));
 const farms=[...new Set(p.fieldRefs.map(r=>r.farmId))].map(fid=>byId(DB.farms,fid));
 const plan=()=>JSON.stringify({certification:{issuer:MT.issuer,certificateId:MT.certId,certifiedAt:MT.certAt,files:MT.files},assets:Object.entries(MT.vals).flatMap(([k,v])=>Object.entries(v).filter(([,n])=>Number(n)>0).map(([ts,n])=>{const [field,y]=k.split('|');const [t,s]=ts.split(':');return {field,vintage:+y,type:t,source:s,amount:+n}}))},null,2);
 return `<div class="crumb"><a href="#/projects/${pid}" class="icb">${I.back}</a><div><div>Add tokens</div><div class="small" style="font-weight:400">${esc(p.name)}</div></div></div>
 <div class="card"><h2>Certification (required)</h2><p class="sub">Upload certification first. The issuance operation will only be created after certification exists (at least 1 file and at least 1 PDF).</p>
 <label class="drop" style="display:block;cursor:pointer">${I.upload.replace('<svg','<svg width="22"')}<br><b style="color:var(--tx)">Click to add files</b> or drag &amp; drop<br><span class="small">Must include at least one NEW PDF. Max 16MB per file.</span><input type="file" multiple hidden data-mt="files"></label>
 <p>${hasPdf?`<span class="badge b-done">PDF attached</span> <span class="small">${MT.files.map(esc).join(', ')}</span>`:'<span class="badge b-cancelled">PDF required</span>'}</p></div>
 <div class="card"><h2>Issuance plan</h2><p class="sub">Configure assets by field and vintage year.</p>
 <div class="tabs"><button class="${MT.mode==='form'?'on':''}" data-a="mtMode" data-k="form">Form</button><button class="${MT.mode==='json'?'on':''}" data-a="mtMode" data-k="json">JSON</button></div>
 <div class="row3"><div class="field"><label>Certificate issuer</label><input type="text" data-mt="issuer" placeholder="e.g. Verifier name" value="${esc(MT.issuer)}"></div><div class="field"><label>Registry / Certificate ID</label><input type="text" data-mt="certId" placeholder="e.g. CERT-12345" value="${esc(MT.certId)}"></div><div class="field"><label>Certified at</label><input type="date" data-mt="certAt" value="${MT.certAt}"></div></div>
 <div style="display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><span class="alloc" style="margin:0;padding:6px 10px;font-size:12px">Allowed vintage years: ${minY}–${maxY} (max already issued: ${maxIssued||'none'})</span><button class="btn" data-a="mtYear" ${MT.years.length>=maxY-minY+1?'disabled':''}>${I.plus.replace('<svg','<svg width="14"')} Add year</button></div>
 ${MT.mode==='form'?`<div class="tw"><table class="mgrid"><thead><tr><th style="text-align:left">Field</th>${MT.years.map(y=>`<th>${y} <button class="icb" data-a="mtDelYear" data-k="${y}" aria-label="Remove year">×</button></th>`).join('')}</tr></thead><tbody>
  ${farms.map(f=>`<tr class="farm"><td colspan="${MT.years.length+1}">${esc(f.name)}</td></tr>`+p.fieldRefs.filter(r=>r.farmId===f.id).map(r=>`<tr><td style="text-align:left" class="mono">${esc(r.code)}</td>${MT.years.map(y=>{const v=MT.vals[r.code+'|'+y]||{};const s=sum(Object.values(v).map(Number).filter(n=>n>0));return `<td class="cell" data-a="mtCell" data-k="${esc(r.code)}|${y}">${s?`<b style="color:var(--tx)">${fN(s)}</b>`:'+'}</td>`}).join('')}</tr>`).join('')).join('')}
 </tbody></table></div>`:`<textarea style="min-height:220px" class="mono" readonly>${esc(plan())}</textarea>`}
 ${MT.err?`<p class="err">${MT.err}</p>`:''}
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><span class="small">${fN(tot)} tokens</span><span><button class="btn" data-a="mtClear">Clear</button> <button class="btn pri" data-a="mtIssue" ${tot>0&&hasPdf?'':'disabled'}>Issue tokens</button></span></div></div>`;
}
function mtCell(key){
 const [code,y]=key.split('|'); const v=MT.vals[key]||{};
 const row=(t,s)=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><span style="width:60px">${tbadge(t)}</span><input type="number" min="0" data-cell="${t}:${s}" value="${v[t+':'+s]||''}" placeholder="0"></div>`;
 modal(`<h3>Asset Values</h3><p class="sub">Configure biogenic and technological asset values for <b>${esc(code)}</b> in vintage year <b>${y}</b>.</p>
 <p class="small" style="font-weight:600;letter-spacing:.06em">BIOGENIC ASSETS</p>${['ret','red','rmv'].map(t=>row(t,'bio')).join('')}
 <p class="small" style="font-weight:600;letter-spacing:.06em;margin-top:12px">TECHNOLOGICAL ASSETS</p>${['ret','red','rmv'].map(t=>row(t,'tec')).join('')}
 <div class="dlgfoot" style="justify-content:space-between"><button class="btn ghost" style="color:var(--red)" data-a="cellClear">Clear All</button><span><button class="btn" data-a="close">Cancel</button> <button class="btn pri" data-a="cellSave" data-k="${esc(key)}">Save Values</button></span></div>`);
}
function mtIssue(){
 const p=byId(DB.projects,MT.pid); const lines=[]; const now=new Date().toISOString();
 Object.entries(MT.vals).forEach(([k,v])=>{const [code,y]=k.split('|');const fr=p.fieldRefs.find(r=>r.code===code);Object.entries(v).forEach(([ts,n])=>{n=Math.floor(Number(n));if(!(n>0))return;const [t,s]=ts.split(':');const aid=`${p.extRef||p.id}:${code}:${t}:${s}:${y}`;if(!DB.assets.find(a=>a.id===aid))DB.assets.push({id:aid,projectId:p.id,type:t,source:s,vintage:+y,farmId:fr?.farmId,fieldCode:code});lines.push({assetId:aid,amount:n})})});
 DB.operations.unshift({id:uid('op'),name:`Issuance ${MT.years.join('/')}`,type:'Issue',projectId:p.id,fromBusinessId:p.businessId,targetBusinessId:null,lines,status:'Done',createdAt:now,completedAt:now,attachments:[...MT.files],notes:'',cert:{issuer:MT.issuer,certId:MT.certId,certifiedAt:MT.certAt}});
 MT.files.forEach(f=>p.documents.push({name:f,kind:'Certification',addedAt:now}));
 if(p.status==='Draft') p.status='Active';
 MT=null; toast(`Issued ${fN(sum(lines.map(l=>l.amount)))} tokens`); go(`#/projects/${p.id}?tab=assets`);
}

 <div class="field"><label>Business</label><select id="uBiz"><option value="">None</option>${DB.businesses.map(b=>`<option value="${b.id}" ${b.id===u.businessId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div></div><div class="err" id="uErr"></div>
 <div class="dlgfoot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="userSave" data-id="${id||''}">Save</button></div>`);
}

/* ================= simple create dialogs ================= */
function bizForm(){modal(`<h3>Create Business</h3><div class="field"><label>Name *</label><input type="text" id="bName"></div><div class="field"><label>External Reference *</label><input type="text" id="bExt" placeholder="e.g. BUY-0020"></div><div class="field"><label>Type</label><select id="bType"><option>Buyer</option><option>Project Developer</option></select></div><div class="err" id="bErr"></div><div class="dlgfoot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="bizSave">Create</button></div>`)}
function farmForm(){modal(`<h3>Create Farm</h3><div class="field"><label>Owner business *</label><select id="fBiz">${DB.businesses.filter(b=>b.type==='Project Developer').map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Name *</label><input type="text" id="fName"></div><div class="field"><label>External Reference</label><input type="text" id="fExt"></div><div class="field"><label>Number of fields</label><input type="number" id="fN" value="2" min="0"></div><div class="err" id="fErr"></div><div class="dlgfoot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="farmSave">Create</button></div>`)}

 {t:'Test data lives in the production registry',sev:'hi',ver:true,area:'Data integrity',obs:'Live registry lists "Sample Project" (Fusuma, located "Al Wahat, Libia"), farm "FARM TEST" and asset IDs like PROJ_001:TEST_001 as Active alongside real credits, with 1,140 tCO2e issued.',imp:'Buyers and auditors can see or transact against test units. Add an environment flag or sandbox tenant, block test assets from Transfer/Retire, and purge or archive.',link:'#/projects'},
 {t:'Issue order amount does not match tokens issued',sev:'hi',ver:true,area:'Ledger',obs:'Sample Project: issue operation shows +1,200 but its assets sum to 1,140 (200+300+100+200+240+100). The "Cultiva Carbono ... Hnos. Andrada-Vanderwilde" project shows 563 issued, which matches none of the four BALAM issue operations (+441, +1,213, +714, +641).',imp:'Headline order amount appears to be stored separately from asset lines. Derive it from lines, or add a reconciliation check that blocks mismatches. Mapping of issue operations to projects also needs to be visible in the operations list.',link:'#/operations'},

 {t:'Duplicate buyer entities',sev:'med',ver:true,area:'Master data',obs:'"TARAJE NUEVO S COOP AND" and "TARAJE NUEVO S.COOP AND." exist as separate businesses. The Create Operation target dropdown lists "Colegio Oficial de Ópticos-Optometristas de Andalucía" twice.',imp:'Retirement and holdings reports can split one beneficiary across two wallets. Add a tax ID (CIF/VAT) as unique key, fuzzy duplicate warning on create, and a merge tool.',link:'#/businesses'},

function checks(){
 const L=ledger(); const out=[];
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
 const g={};DB.businesses.forEach(b=>{(g[norm(b.name)]??=[]).push(b)});
 const dups=Object.values(g).filter(x=>x.length>1);
 out.push({n:'Duplicate business names (normalised)',c:dups.length,d:dups.map(x=>x.map(b=>`<a href="#/businesses/${b.id}">${esc(b.name)}</a>`).join(' = ')).join('<br>')});
 const mism=DB.operations.filter(o=>o.type==='Issue'&&o.declared!=null&&o.declared!==opTotal(o));
 out.push({n:'Issue operations where order amount ≠ asset lines',c:mism.length,d:mism.map(o=>`<a href="javascript:void 0" data-a="opView" data-id="${o.id}">${o.id}</a> (${o.declared} vs ${opTotal(o)})`).join('<br>')});
 const nocert=DB.operations.filter(o=>o.type==='Issue'&&o.status==='Done'&&!o.attachments.some(f=>/\.pdf$/i.test(f)));
 out.push({n:'Issue operations without a certificate PDF',c:nocert.length,d:nocert.map(o=>`<a href="#/projects/${o.projectId}?tab=documents">${esc(byId(DB.projects,o.projectId)?.name)}</a>`).join('<br>')});
 const zero=DB.projects.filter(p=>p.status==='Active'&&!p.areaHa);
 out.push({n:'Active projects with 0 ha area',c:zero.length,d:zero.map(p=>`<a href="#/projects/${p.id}">${esc(p.name)}</a>`).join('<br>')});
 const tst=DB.projects.filter(p=>p.isTest||/test|sample|demo/i.test(p.name+' '+bizName(p.businessId)));
 out.push({n:'Test or demo projects in registry',c:tst.length,d:tst.map(p=>`<a href="#/projects/${p.id}">${esc(p.name)}</a>`).join('<br>')});
 const neg=[];DB.assets.forEach(a=>Object.entries(L.hold[a.id]||{}).forEach(([b,n])=>{if(n<0)neg.push(`${a.id} @ ${esc(bizName(b))}: ${n}`)}));
 out.push({n:'Negative balances',c:neg.length,d:neg.join('<br>')});
 const over=[];DB.assets.forEach(a=>Object.entries(L.reserved[a.id]||{}).forEach(([b,n])=>{if(n>L.held(a.id,b))over.push(`${a.id} @ ${esc(bizName(b))}`)}));
 out.push({n:'Pending orders exceeding holdings',c:over.length,d:over.join('<br>')});
 const orphan=DB.farms.filter(f=>!DB.projects.some(p=>p.fieldRefs.some(r=>r.farmId===f.id)));
 out.push({n:'Farms not used in any project',c:orphan.length,d:orphan.map(f=>`<a href="#/farms/${f.id}">${esc(f.name)}</a>`).join('<br>')});
 const noBiz=DB.users.filter(u=>u.role==='Business User'&&!u.businessId);
 out.push({n:'Business users with no business',c:noBiz.length,d:noBiz.map(u=>esc(u.name+' · '+u.email)).join('<br>')});
 const styles={};DB.businesses.forEach(b=>{const s=/^mig-/.test(b.extRef)?'mig-slug':/^[A-Z]{2,5}-\d+$/.test(b.extRef)?'CODE-0000':/\s/.test(b.extRef)?'legal name':/_/.test(b.extRef)?'UPPER_SNAKE':'other';styles[s]=(styles[s]||0)+1});
 out.push({n:'External reference formats in use',c:Object.keys(styles).length,d:Object.entries(styles).map(([k,v])=>`${k}: ${v}`).join(' · '),info:true});
 return out;
}
/* ================= events ================= */
document.addEventListener('click',e=>{
 const pg=e.target.closest('[data-pg]'); if(pg&&!pg.disabled){const [k,n]=pg.dataset.pg.split(':');UI.pages[k]=+n;render();return}
 const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
 const el=e.target.closest('[data-a]'); if(!el) return;
 const a=el.dataset.a, id=el.dataset.id, k=el.dataset.k;
 if(a==='closeov'&&e.target!==el) return;
 const H={
  close:()=>closeModal(), closeov:()=>closeModal(),
  copy:()=>copy(id),
  collapse:()=>document.getElementById('side').classList.toggle('col'),
  nyi:()=>toast('Tab not replicated. Configure assets via Add tokens.'),
  share:()=>copy(location.href.split('#')[0]+'#/projects/'+id),
  export:()=>{const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='registry-replica-data.json';l.click();URL.revokeObjectURL(u)},
  import:()=>document.getElementById('importFile').click(),
  reset:()=>confirmDlg('Reset test data','Replace all data in this tab with the original seeded test data?',()=>{DB=seed();CO=MT=PF=null;UI.pages={};render();toast('Test data reset')},'Reset'),
  newBiz:bizForm, newFarm:farmForm,
  bizSave:()=>{const n=document.getElementById('bName').value.trim(),x=document.getElementById('bExt').value.trim();if(!n||!x){document.getElementById('bErr').textContent='Name and external reference are required.';return}const now=new Date().toISOString();DB.businesses.unshift({id:uid('biz'),name:n,extRef:x,type:document.getElementById('bType').value,createdAt:now,updatedAt:now,orgs:[{id:uid('org'),name:n+" Default's Organization",isDefault:true,createdAt:now}]});closeModal();render();toast('Business created')},
  farmSave:()=>{const n=document.getElementById('fName').value.trim();if(!n){document.getElementById('fErr').textContent='Name is required.';return}const now=new Date().toISOString();const c=Math.max(0,+document.getElementById('fN').value||0);DB.farms.unshift({id:uid('farm'),name:n,extRef:document.getElementById('fExt').value.trim()||'—',businessId:document.getElementById('fBiz').value,createdAt:now,updatedAt:now,fields:Array.from({length:c},(_,i)=>({code:'FIELD-'+String(i+1).padStart(3,'0'),areaHa:50}))});closeModal();render();toast('Farm created')},
  addField:()=>{const f=byId(DB.farms,id);f.fields.push({code:'FIELD-'+String(f.fields.length+1).padStart(3,'0'),areaHa:50});f.updatedAt=new Date().toISOString();render()},
  delBiz:()=>{const b=byId(DB.businesses,id);const used=DB.projects.some(p=>p.businessId===id)||DB.operations.some(o=>o.targetBusinessId===id||o.fromBusinessId===id);confirmDlg('Delete business',used?`<b>${esc(b.name)}</b> has projects or operations. The live registry's behaviour here is unknown; the replica blocks it.`:`Delete <b>${esc(b.name)}</b>?`,()=>{if(used){toast('Blocked: business has ledger history');return}DB.businesses=DB.businesses.filter(x=>x.id!==id);render()},used?'OK':'Delete')},
  delFarm:()=>{const f=byId(DB.farms,id);const used=DB.projects.some(p=>p.fieldRefs.some(r=>r.farmId===id));confirmDlg('Delete farm',used?`<b>${esc(f.name)}</b> is used by a project and cannot be deleted in the replica.`:`Delete <b>${esc(f.name)}</b>?`,()=>{if(used)return;DB.farms=DB.farms.filter(x=>x.id!==id);render()},used?'OK':'Delete')},
  delProj:()=>{const p=byId(DB.projects,id);const used=DB.operations.some(o=>o.projectId===id);confirmDlg('Delete project',used?`<b>${esc(p.name)}</b> has issued units and cannot be deleted in the replica.`:`Delete <b>${esc(p.name)}</b>?`,()=>{if(used)return;DB.projects=DB.projects.filter(x=>x.id!==id);render()},used?'OK':'Delete')},
  delUser:()=>{const u=byId(DB.users,id);confirmDlg('Delete user',`Delete <b>${esc(u.name)}</b>?`,()=>{DB.users=DB.users.filter(x=>x.id!==id);render()})},
  newOrg:()=>{const b=byId(DB.businesses,id);modal(`<h3>Add organization</h3><div class="field"><label>Name</label><input type="text" id="oName"></div><div class="dlgfoot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" id="oSave">Add</button></div>`);document.getElementById('oSave').onclick=()=>{const n=document.getElementById('oName').value.trim();if(!n)return;b.orgs.push({id:uid('org'),name:n,isDefault:false,createdAt:new Date().toISOString()});closeModal();render()}},
  editOrg:()=>{const o=byId(DB.businesses,id).orgs.find(x=>x.id===el.dataset.org);modal(`<h3>Edit organization</h3><div class="field"><label>Name</label><input type="text" id="oName" value="${esc(o.name)}"></div><div class="dlgfoot"><button class="btn" data-a="close">Cancel</button><button class="btn pri" id="oSave">Save</button></div>`);document.getElementById('oSave').onclick=()=>{o.name=document.getElementById('oName').value.trim()||o.name;closeModal();render()}},
  delOrg:()=>{const b=byId(DB.businesses,id);confirmDlg('Delete organization','Delete this organization?',()=>{b.orgs=b.orgs.filter(x=>x.id!==el.dataset.org);render()})},
  opView:()=>opView(id), opMenu:()=>opView(id),
  opIssue:()=>{const o=byId(DB.operations,id);const L=ledger();const short=o.lines.find(l=>L.held(l.assetId,o.fromBusinessId)<l.amount);if(short){toast('Insufficient balance to complete');return}o.status='Done';o.completedAt=new Date().toISOString();closeModal();render();toast('Operation issued')},
  opCancel:()=>{const o=byId(DB.operations,id);o.status='Cancelled';o.completedAt=new Date().toISOString();closeModal();render();toast('Operation cancelled')},
  coType:()=>{CO.type=k;render()}, coMethod:()=>{CO.method=k;CO.amt={};CO.err={};render()},
  coMax:()=>{CO.amt[k]=el.dataset.max;render()}, coSubmit:()=>coSubmit(),
  mtMode:()=>{MT.mode=k;render()}, mtCell:()=>mtCell(k),
  mtYear:()=>{const maxIssued=Math.max(0,...projAssets(MT.pid).map(a=>a.vintage));const min=maxIssued?maxIssued+1:2020;for(let y=2026;y>=min;y--){if(!MT.years.includes(y)){MT.years.push(y);MT.years.sort();break}}render()},
  mtDelYear:()=>{MT.years=MT.years.filter(y=>y!=k);Object.keys(MT.vals).forEach(x=>{if(x.endsWith('|'+k))delete MT.vals[x]});render()},
  mtClear:()=>{MT.vals={};render()},
  mtIssue:()=>{if(!MT.issuer||!MT.certId||!MT.certAt){MT.err='Certificate issuer, ID and date are required.';render();return}mtIssue()},
  cellClear:()=>document.querySelectorAll('[data-cell]').forEach(i=>i.value=''),
  cellSave:()=>{const v={};document.querySelectorAll('[data-cell]').forEach(i=>{if(Number(i.value)>0)v[i.dataset.cell]=Math.floor(Number(i.value))});MT.vals[k]=v;closeModal();render()},
  pfSave:()=>pfSave(), pfSdg:()=>{const n=+k;PF.sdgs=PF.sdgs.includes(n)?PF.sdgs.filter(x=>x!==n):[...PF.sdgs,n];render()},
  userForm:()=>userForm(id),
  userSave:()=>{const n=document.getElementById('uName').value.trim(),em=document.getElementById('uEmail').value.trim();if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){document.getElementById('uErr').textContent='Name and a valid email are required.';return}if(DB.users.some(u=>u.email.toLowerCase()===em.toLowerCase()&&u.id!==id)){document.getElementById('uErr').textContent='A user with this email already exists.';return}const data={name:n,email:em,role:document.getElementById('uRole').value,businessId:document.getElementById('uBiz').value||null};if(id)Object.assign(byId(DB.users,id),data);else DB.users.push({id:uid('usr'),...data,createdAt:new Date().toISOString()});closeModal();render();toast('User saved')},
 };
 if(H[a]){e.preventDefault();H[a]()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.q!==undefined){UI.q[t.dataset.q]=t.value;Object.keys(UI.pages).forEach(k=>UI.pages[k]=1);const pos=t.selectionStart;AFTER=()=>{const n=document.querySelector(`[data-q="${t.dataset.q}"]`);if(n){n.focus();n.setSelectionRange(pos,pos)}};render();return}
 if(t.dataset.co&&CO&&t.type!=='file'){const [f,key]=t.dataset.co.split(':');if(key)CO[f][key]=t.value;else CO[f]=t.value;if(f==='amt'){const btn=document.querySelector('[data-a="coSubmit"]');const tot=sum(Object.values(CO.amt).map(Number).filter(n=>n>0));if(btn){btn.disabled=!tot;btn.textContent=`Create Operation (${fN(tot)} tokens)`}}}
 if(t.dataset.mt&&MT&&t.type!=='file') MT[t.dataset.mt]=t.value;
 if(t.dataset.pf&&PF&&t.tagName!=='SELECT') PF[t.dataset.pf]=t.value;
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.per){UI.per[t.dataset.per]=+t.value;UI.pages[t.dataset.per]=1;render();return}
 if(t.dataset.a==='coPick'&&t.value){go('#/operations/create?projectId='+t.value);return}
 if(t.dataset.lang!==undefined){toast('Spanish UI strings are not included in the replica');t.value='🇬🇧 EN';return}
 if(t.dataset.co==='files'){CO.files=[...CO.files,...[...t.files].map(f=>f.name)].slice(0,10);render();return}
 if(t.dataset.co==='from'||t.dataset.co==='target'||(t.dataset.co||'').startsWith('cur:')){const [f,key]=t.dataset.co.split(':');if(key)CO[f][key]=t.value;else CO[f]=t.value;if(f==='from'){CO.amt={};CO.target=CO.target===t.value?'':CO.target}render();return}
 if(t.dataset.mt==='files'){MT.files=[...MT.files,...[...t.files].map(f=>f.name)];MT.err='';render();return}
 if(t.dataset.pf==='biz'){PF.biz=t.value;PF.org=byId(DB.businesses,t.value)?.orgs.find(o=>o.isDefault)?.id||'';PF.farms=[];render();return}
 if(t.dataset.pf==='org'||t.dataset.pf==='status'){PF[t.dataset.pf]=t.value;return}
 if(t.dataset.pfarm){PF.farms=t.checked?[...PF.farms,t.dataset.pfarm]:PF.farms.filter(x=>x!==t.dataset.pfarm);return}
 if(t.dataset.pprac){PF.practices=t.checked?[...PF.practices,t.dataset.pprac]:PF.practices.filter(x=>x!==t.dataset.pprac);return}
 if(t.id==='importFile'&&t.files[0]){t.files[0].text().then(s=>{try{const d=JSON.parse(s);if(!d.businesses||!d.operations)throw 0;DB=d;CO=MT=PF=null;render();toast('Data imported')}catch{toast('Not a replica export file')}t.value=''})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
render();
