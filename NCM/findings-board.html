<title>NCM Registry Review Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f6f4;--col:#e9eeea;--card:#ffffff;--ink:#14211b;--mut:#5b6962;--line:#d6ded9;
 --acc:#1f7a4d;--acc-bg:#dcefe3;
 --hi:#b42318;--hi-bg:#fde6e3;--med:#a15c07;--med-bg:#fdf0d5;--lo:#475467;--lo-bg:#e8ecf1;
 --ok:#157347;--ok-bg:#dcf2e4;--inf:#3b4cb8;--inf-bg:#e3e7fb;
 --shadow:0 1px 2px rgba(20,33,27,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#111714;--col:#18201c;--card:#1f2924;--ink:#e4ece7;--mut:#9aa9a1;--line:#2e3a34;
 --acc:#5cc18b;--acc-bg:#1c3a2a;
 --hi:#ff8a7a;--hi-bg:#44211d;--med:#f2b454;--med-bg:#3d2f14;--lo:#b4bfcc;--lo-bg:#29313b;
 --ok:#6fd39b;--ok-bg:#183626;--inf:#a3b0ff;--inf-bg:#262c4d;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#111714;--col:#18201c;--card:#1f2924;--ink:#e4ece7;--mut:#9aa9a1;--line:#2e3a34;
 --acc:#5cc18b;--acc-bg:#1c3a2a;
 --hi:#ff8a7a;--hi-bg:#44211d;--med:#f2b454;--med-bg:#3d2f14;--lo:#b4bfcc;--lo-bg:#29313b;
 --ok:#6fd39b;--ok-bg:#183626;--inf:#a3b0ff;--inf-bg:#262c4d;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding-inline:20px;padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-end}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{margin:2px 0 4px;font-size:26px;line-height:1.15;text-wrap:balance}
.sub{margin:0;color:var(--mut);max-width:68ch}
.status{font-size:12px;color:var(--mut)}
.status b{color:var(--ink);font-weight:500}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tile .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.tile.alert .v{color:var(--hi)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:12px;color:var(--mut);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,summary:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.over{outline:2px dashed var(--acc);outline-offset:-2px}
.colhd{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.colhd h2{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.colhd .n{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.colhd p{margin:2px 0 0;font-size:11.5px;color:var(--mut)}
.empty{font-size:12.5px;color:var(--mut);padding:14px 6px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 11px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;cursor:grab}
.card.dragging{opacity:.45}
.card .top{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mut)}
.card .top .kind{margin-left:auto;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.card h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.3}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:500;white-space:nowrap}
.b.hi{background:var(--hi-bg);color:var(--hi)}.b.med{background:var(--med-bg);color:var(--med)}.b.lo{background:var(--lo-bg);color:var(--lo)}
.b.ver{background:var(--ok-bg);color:var(--ok)}.b.req{background:var(--acc-bg);color:var(--acc)}.b.inf{background:var(--inf-bg);color:var(--inf)}
.b.area{background:transparent;border:1px solid var(--line);color:var(--mut)}
.b.pass{background:var(--ok-bg);color:var(--ok)}.b.fail{background:var(--hi-bg);color:var(--hi)}.b.info{background:var(--inf-bg);color:var(--inf)}
details{font-size:12.5px}
summary{cursor:pointer;color:var(--mut);font-size:12px}
details p{margin:6px 0 0}
details .imp b{color:var(--acc)}
.detail{white-space:pre-line;font-size:12px;color:var(--mut);max-height:9em;overflow:auto}
.route{font-size:11.5px;color:var(--mut)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px}
.foot select{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:5px;padding:2px 4px}
.foot .when{font-size:11px;color:var(--mut)}
.note{font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:hover{transform:translateY(-1px)}}
</style>

<script>
const DATA=JSON.parse(document.getElementById('board-data').textContent);
const COLS=[
 {id:'backlog',name:'Backlog',hint:'Not yet reviewed'},
 {id:'triaged',name:'Triaged',hint:'Agreed, owner to assign'},
 {id:'doing',name:'In progress',hint:'Fix underway'},
 {id:'done',name:'Resolved',hint:'Fixed, or check passing'},
];
const SEV={hi:'High',med:'Medium',lo:'Low'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Cards: content comes from the embedded snapshot, column comes from the shared store.
const CARDS=[
 ...(DATA.findings||[]).map(f=>({...f,kind:'finding',def:'backlog'})),
 ...(DATA.checks||[]).map(c=>({...c,kind:'check',sev:c.info?'lo':c.count?'hi':'lo',def:c.info?'triaged':c.count?'backlog':'done'})),
];
let STATE={};            // id -> {col, at}
let db=null, live=false;
const F={kind:'all',sev:'all'};
try{const s=JSON.parse(localStorage.getItem('ncm-board-filter')||'null');if(s)Object.assign(F,s)}catch{}

const colOf=c=>STATE[c.id]?.col||c.def;
const shown=c=>(F.kind==='all'||F.kind===c.kind)&&(F.sev==='all'||F.sev===c.sev);
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'}):'';

function cardHtml(c){
 const opts=COLS.map(k=>`<option value="${k.id}" ${colOf(c)===k.id?'selected':''}>${k.name}</option>`).join('');
 const moved=STATE[c.id]?.at?`<span class="when">Moved ${fmtDate(STATE[c.id].at)}</span>`:'<span class="when"></span>';
 let body;
 if(c.kind==='finding'){
  body=`<div class="badges"><span class="b ${c.sev}">${SEV[c.sev]}</span>${c.requested?'<span class="b req">Requested</span>':`<span class="b ${c.verified?'ver':'inf'}">${c.verified?'Verified':'Inferred'}</span>`}<span class="b area">${esc(c.area)}</span></div>
  <details><summary>Observation and implication</summary><p>${esc(c.obs)}</p><p class="imp"><b>Implication:</b> ${esc(c.imp)}</p><p class="route mono">Replica: ${esc(c.route)}</p></details>`;
 }else{
  const res=c.info?`<span class="b info">${esc(c.count)} in use</span>`:c.count?`<span class="b fail">${c.count} failing</span>`:'<span class="b pass">Pass</span>';
  body=`<div class="badges">${res}<span class="b area">Data check</span></div>${c.detail?`<details><summary>Affected records</summary><div class="detail mono">${esc(c.detail)}</div></details>`:''}`;
 }
 return `<article class="card" draggable="true" tabindex="0" data-id="${esc(c.id)}">
  <div class="top"><span class="mono">${esc(c.kind==='finding'?c.id:'CHK')}</span><span class="kind">${c.kind==='finding'?'Finding':'Check'}</span></div>
  <h3>${esc(c.title)}</h3>${body}
  <div class="foot">${moved}<label><span hidden>Status</span><select id="st-${esc(c.id)}" data-move="${esc(c.id)}" aria-label="Status for ${esc(c.title)}">${opts}</select></label></div></article>`;
}

function render(){
 const vis=CARDS.filter(shown);
 document.getElementById('board').innerHTML=COLS.map(k=>{
  const cs=vis.filter(c=>colOf(c)===k.id);
  return `<section class="col" data-col="${k.id}" aria-label="${k.name}"><div class="colhd"><div><h2>${k.name}</h2><p>${k.hint}</p></div><span class="n">${cs.length}</span></div>${cs.map(cardHtml).join('')||'<div class="empty">Nothing here</div>'}</section>`;
 }).join('');
 const open=CARDS.filter(c=>colOf(c)!=='done');
 const hiOpen=open.filter(c=>c.kind==='finding'&&c.sev==='hi').length;
 const failing=CARDS.filter(c=>c.kind==='check'&&!c.info&&c.count).length;
 const nChecks=CARDS.filter(c=>c.kind==='check'&&!c.info).length;
 document.getElementById('summary').innerHTML=`
  <div class="tile"><div class="l">Open items</div><div class="v">${open.length}<small>of ${CARDS.length}</small></div></div>
  <div class="tile ${hiOpen?'alert':''}"><div class="l">High findings open</div><div class="v">${hiOpen}</div></div>
  <div class="tile"><div class="l">Findings resolved</div><div class="v">${CARDS.filter(c=>c.kind==='finding'&&colOf(c)==='done').length}<small>of ${CARDS.filter(c=>c.kind==='finding').length}</small></div></div>
  <div class="tile ${failing?'alert':''}"><div class="l">Checks failing</div><div class="v">${failing}<small>of ${nChecks}</small></div></div>`;
 const chip=(k,v,l)=>`<button class="chip" data-f="${k}:${v}" aria-pressed="${F[k]===v}">${l}</button>`;
 document.getElementById('filters').innerHTML=`<span class="lbl">Show</span>${chip('kind','all','All')}${chip('kind','finding','Findings')}${chip('kind','check','Checks')}<span class="sep"></span><span class="lbl">Severity</span>${chip('sev','all','Any')}${chip('sev','hi','High')}${chip('sev','med','Medium')}${chip('sev','lo','Low')}`;
 document.getElementById('status').innerHTML=`Snapshot <b class="mono">${esc(DATA.generated||'')}</b> · ${live?'Moves are shared':'Moves are not saved in this view'}`;
}

async function move(id,col){
 if(colOf(CARDS.find(c=>c.id===id))===col)return;
 const prev=STATE[id];
 STATE[id]={col,at:new Date().toISOString()};
 render();
 if(!db)return;
 try{await db.collection('cards').doc(id).set(STATE[id])}
 catch(e){STATE[id]=prev;if(!prev)delete STATE[id];render();document.getElementById('note').textContent=e?.code==='not_granted'?'You can view this board but not move cards.':'Could not save that move. Try again.'}
}

document.addEventListener('click',e=>{
 const f=e.target.closest('[data-f]');if(!f)return;
 const [k,v]=f.dataset.f.split(':');F[k]=v;
 try{localStorage.setItem('ncm-board-filter',JSON.stringify(F))}catch{}
 render();
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-move]');if(s)move(s.dataset.move,s.value)});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();const id=dragId;col.classList.remove('over');move(id,col.dataset.col)});

render();
(async()=>{
 db=await window.claude?.use?.('db').catch(()=>null)??null;
 if(!db)return;
 db.collection('cards').onSnapshot(snap=>{
  live=true;const next={};
  snap.docs.forEach(d=>{const v=d.data();if(v&&COLS.some(k=>k.id===v.col))next[d.id]=v});
  STATE=next;render();
 },()=>{live=false;render()});
})();
</script>
